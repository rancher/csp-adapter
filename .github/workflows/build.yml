name: Build
on: 
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4 

      - name: Setup GO
        uses: ./.github/actions/setup

      - name: Run Build
        run: make build

      - name: Run Tests
        run: make test
